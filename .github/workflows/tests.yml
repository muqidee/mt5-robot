name: Offline tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -e ".[mt5]"
      - name: Run offline tests (no terminal connection)
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m bijisatu doctor

